[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genar"
version = "0.1.0"
description = "Generative Adverse Event Reporting System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "pandas>=2.0.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "langgraph>=0.2.0",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.scripts]
genar = "genar.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
